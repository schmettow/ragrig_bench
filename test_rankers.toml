# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["book=@fixtures/html"]

queries = [
  "What does this book say about Bayesian statistics?",
  "What do I do, when my response time measures are not normal?"
]

[[agents]]
label = "ctx-4096"
[agents.chat]
context_tokens = 4096

[[agents]]
label = "ctx-8192"
[agents.chat]
context_tokens = 8192

# ── Rankers to sweep (interaction side — swapped at query time) ──────────────
[[rankers]]
name = "rrf"

[[rankers]]
name = "cosine"
