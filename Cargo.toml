[package]
name = "ragrig-bench"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "RAG quality evaluator — benchmark local LLMs for retrieval-augmented generation on your own documents, pipelines, and rankers."
license = "MIT"
repository = "https://github.com/schmettow/ragrig_bench"
keywords = ["rag", "llm", "benchmark", "retrieval", "ollama"]
categories = ["command-line-utilities"]

# Only these files ship in the crates.io package — the repo also carries
# experiment configs and report outputs that are not part of the release.
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "mock.toml",
    "test_rankers.toml",
]

[dependencies]
# The path keeps local development on the in-tree ragrig; the version is
# what crates.io users resolve.  ragrig 1.0.0 must be published before
# ragrig-bench 0.3.0 can be.
# ragrig = { version = "1.0", path = "../ragrig", features = ["test-fixtures"] }
ragrig = { version = "1", features = ["test-fixtures"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
