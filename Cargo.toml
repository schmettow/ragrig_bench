[package]
name = "ragrig_bench"
version = "0.1.0"
edition = "2024"

[dependencies]
ragrig = { path = "../ragrig", features = ["test-fixtures"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
clap = { version = "4", features = ["derive"] }
