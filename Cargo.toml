[package]
name = "ragrig-bench"
version = "0.2.0"
edition = "2024"

[dependencies]
# ragrig = { version = "1.0", features = ["test-fixtures"] }
ragrig = { path = "../ragrig", features = ["test-fixtures"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
